
name: Deploy Righttouch API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: righttouch-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_HOST: ${{ secrets.RIGHTTOUCH_HOST }}
          DEPLOY_USER: ${{ secrets.RIGHTTOUCH_USER }}
        with:
          host: ${{ secrets.RIGHTTOUCH_HOST }}
          username: ${{ secrets.RIGHTTOUCH_USER }}
          key: ${{ secrets.RIGHTTOUCH_SSH_KEY }}
          envs: DEPLOY_HOST,DEPLOY_USER
          command_timeout: 12m
          script: |
            set -eu
            cd /var/www/righttouch-api

            echo "Fetching latest main..."
            git fetch origin main

            echo "Syncing production code with GitHub main..."
            git reset --hard origin/main

            echo "Verifying package.json..."
            node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"

            echo "Installing production dependencies..."
            npm ci --omit=dev

            echo "Restarting API..."
            pm2 restart righttouch-api --update-env
            pm2 save

            echo "Checking API health..."
            for attempt in $(seq 1 18); do
              if curl --fail --silent --show-error \
                https://api.righttouchservice.com/health/ready; then
                echo
                echo "Deployment successful."
                exit 0
              fi
              sleep 5
            done

            echo "Health check failed. Recent application logs:"
            pm2 logs righttouch-api --lines 80 --nostream
            exit 1
